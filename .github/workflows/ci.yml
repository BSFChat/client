name: CI

on:
  push:
    # release/** so a stabilisation branch gets the same three-platform +
    # sanitizer run as main BEFORE it is tagged (tags are only pushed once
    # that run is green).
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

  # Manual runs, so that the store-submission paths can be exercised
  # without a tag.
  #
  # Every signing, packaging and upload step in this file is gated on
  # `startsWith(github.ref, 'refs/tags/v')`, which means the FIRST time
  # any of them runs for real is a tag push — the one moment where a
  # mistake is expensive and irreversible. An .aab that fails to build
  # takes the release with it; an .ipa that uploads with a bad build
  # number burns that number permanently; a versionCode reaching any
  # Play track can never be reused. Being able to rehearse the whole
  # path from a branch is worth the three inputs.
  #
  # It also answers a narrower need: Google will not accept an app's
  # FIRST bundle through the Play Developer API, so the first upload is
  # a human dragging an .aab into the Console. Producing that .aab used
  # to require cutting a tag for a release nobody intends to promote.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to build as, e.g. 0.0.53-rc.1. Leave blank to derive
          one the way a branch push does. SET THIS EXPLICITLY for
          anything you intend to upload: a derived branch version is
          "<last tag>-dev.<sha>", whose Android versionCode deliberately
          collides with the eventual release's (see cmake/Version.cmake),
          and uploading it would burn that release's number for good.
        required: false
        type: string
      android_aab:
        description: >-
          Build and sign the Play .aab as well as the .apk. Requires the
          ANDROID_KEYSTORE_* secrets.
        required: false
        type: boolean
        default: false
      ios_upload:
        description: >-
          Upload the .ipa to TestFlight. Requires the iOS signing and
          App Store Connect secrets. A build number is consumed
          permanently on upload, so leave this off unless you mean it.
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            qt_arch: clang_64
          - os: windows-latest
            platform: windows
            qt_arch: win64_msvc2022_64
          - os: ubuntu-24.04
            platform: linux
            qt_arch: gcc_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so cmake/Version.cmake's git-describe
          # fallback works for non-tag pushes. Tag builds use the
          # explicit -D override regardless.
          fetch-depth: 0

      - name: Derive version
        id: version
        shell: bash
        run: |
          # On tag pushes GITHUB_REF_NAME is "v0.0.28" → strip the v.
          # On branch/PR pushes we synthesise a -dev suffix so the
          # Updater treats real releases as newer.
          # A manual run may name the version explicitly. That is the
          # only way to produce an uploadable artefact from a branch:
          # a derived "<tag>-dev.<sha>" version maps to the SAME Android
          # versionCode as the eventual release (cmake/Version.cmake
          # says so and warns), so uploading one burns that release's
          # number permanently. Requiring the operator to type it makes
          # the hazard a decision rather than an accident.
          MANUAL="${{ inputs.version }}"
          if [ -n "$MANUAL" ]; then
            if ! [[ "$MANUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::version input '$MANUAL' is not MAJOR.MINOR.PATCH[-suffix]"
              exit 1
            fi
            VER="$MANUAL"
            echo "Version from workflow_dispatch input: $VER"
          else
            REF="${GITHUB_REF_NAME:-}"
            if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              VER="${REF#v}"
            else
              # Compose from the most recent tag + short SHA so two
              # main-branch CI builds produce distinguishable artefacts.
              LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
              LAST="${LAST#v}"
              VER="${LAST}-dev.$(git rev-parse --short HEAD)"
            fi
          fi
          # NSIS VIProductVersion needs MAJOR.MINOR.PATCH.BUILD (four
          # numeric components). Derive by stripping any -suffix and
          # appending .0.
          STRICT="${VER%%-*}"
          NSIS="${STRICT}.0"
          echo "version=$VER"          >> "$GITHUB_OUTPUT"
          echo "version_strict=$STRICT" >> "$GITHUB_OUTPUT"
          echo "version_nsis=$NSIS"     >> "$GITHUB_OUTPUT"
          echo "BSFChat version: $VER (strict=$STRICT nsis=$NSIS)"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 6.10.3: highest version installable on ALL three CI platforms.
          # Clears the 2025-2026 QtSvg Criticals (CVE-2025-10728/10729),
          # the QML SVG code-injection (CVE-2025-14576), Schannel TLS DoS
          # (CVE-2025-6338) and the markdown/image/TLS fixes.
          #
          # Why NOT 6.8.x: 6.8 is LTS; the patch releases where these
          # fixes landed (6.8.4+) are commercial-license only — the
          # open-source aqt mirror carries just 6.8.0-6.8.3.
          # Why NOT 6.11.1: the open-source mirror publishes NO Windows
          # x64 desktop packages for 6.11.1 (windows_arm64 only), so the
          # win64_msvc2022_64 job can't fetch it. 6.10.3 is the newest
          # release present for windows/mac/linux desktop x64.
          #
          # RESIDUAL: CVE-2026-6210 (QtSvg marker heap overflow, High)
          # was fixed in 6.8.8 / 6.11.1 and is NOT in the 6.10 line —
          # revisit when 6.11.x publishes Windows x64 packages.
          # Verified locally against Qt 6.10.2.
          version: '6.10.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # nasm: libaom (AV1 lossless tier) needs it on x86 builders.
          sudo apt-get install -y libssl-dev libgl1-mesa-dev libxkbcommon-dev \
            libxcb-xkb-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-icccm4-dev libxcb-image0-dev libegl1-mesa-dev \
            libpulse-dev libasound2-dev nasm
          pip3 install --break-system-packages cmake==3.30.5

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          # nasm: libaom (AV1 lossless tier) asm on x86; harmless on arm64.
          brew install openssl@3 create-dmg nasm
          # Pin CMake to 3.30 to avoid cmake_minimum_required compat issues
          # with libdatachannel's vendored deps (plog, usrsctp)
          pip3 install --break-system-packages cmake==3.30.5

      # openh264 (H.264 software codec — Linux default, macOS fallback;
      # Windows uses Media Foundation instead) is vendored-prebuilt like
      # the OpenSSL deps: deps/ is gitignored, so every builder produces
      # it from source via the pinned-tag script.
      - name: Build vendored openh264
        if: matrix.platform != 'windows'
        run: bash scripts/build-openh264.sh

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # Chocolatey's CDN is flaky (504s) — wrap the install in
          # a retry loop so a transient gateway error doesn't drop
          # the whole release. Three tries with backoff covers the
          # vast majority of v2-feed hiccups.
          # nasm: libaom (AV1 lossless tier) x86 assembly.
          choco install nasm -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          $ok = $false
          foreach ($i in 1..3) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
              $ok = $true
              break
            }
            Write-Warning "NSIS install attempt $i failed; retrying in $(5 * $i)s"
            Start-Sleep -Seconds (5 * $i)
          }
          # Last-ditch: pull NSIS direct from sourceforge if every
          # choco try 504'd. Idempotent — runs only when makensis
          # isn't on disk yet.
          if (-not $ok) {
            Write-Warning "Falling back to direct download of NSIS"
            $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download"
            Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\nsis.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\nsis.exe" -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            Write-Error "makensis.exe not present after install"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Configure (macOS)
        if: matrix.platform == 'macos'
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBSFCHAT_VERSION="${{ steps.version.outputs.version }}" \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBSFCHAT_VERSION="${{ steps.version.outputs.version }}"

      # CMake 4.0 (currently on windows-latest runners as of mid-2026)
      # dropped compatibility with `cmake_minimum_required(VERSION
      # <3.5)`. Several dependencies predate that floor and won't
      # configure without -DCMAKE_POLICY_VERSION_MINIMUM=3.5 (CMake's
      # own escape hatch — variable introduced in 3.31, no-op on older
      # CMake): libdatachannel's vendored plog/usrsctp/libjuice/libsrtp,
      # AND libyuv's own top-level CMakeLists.txt (VERSION 2.8), plus
      # jwt-cpp's HunterGate.cmake.
      #
      # That spread is why this stays a global flag rather than a
      # PATCH_COMMAND rewriting the offending files: a patch script can
      # only reach one FetchContent project's tree at a time, so it
      # would cover libdatachannel and still leave libyuv failing. We
      # had such a script (cmake/patch-plog.cmake, globbing
      # libdatachannel's deps/*/CMakeLists.txt); it was unwired the same
      # day it landed in favour of this flag and deleted in 2026-09.
      # Don't bring it back — widen the flag's reach instead.
      #
      # macOS/Linux pin CMake to 3.30.5 via pip and don't need this
      # today, but the flag is harmless there and lets us drop those
      # pins later without resurrecting this bug.
      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        # PowerShell parses bare `3.5` as a [double] literal and
        # mangles it (we saw it arrive at cmake.exe as "3"), so the
        # -D arg has to be a single quoted token. Same gotcha with
        # BSFCHAT_VERSION; both stay fully quoted.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DBSFCHAT_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release -j4

      # -j: test fixtures must stay parallel-safe (unique temp dirs and
      # ephemeral ports). Running serially here would let a fixture that
      # shares a fixed path back in without anyone noticing.
      - name: Test
        # test_media_loopback drives raw libdatachannel peer connections over
        # the runner's loopback and intermittently never completes ICE on
        # GitHub's hosted runners — Ubuntu (rc.11, release/0.0.44 twice) AND
        # macOS (release/0.0.44) — on changes that do not touch it, while
        # passing locally every time. It covers no video path that
        # test_video_rtp_loopback (two real managers, two m-lines, DTLS-SRTP)
        # does not; that test stays gating everywhere. Non-gating in CI until
        # the runner-side ICE stall is understood (see PLAN-2026-09.md).
        run: ctest --test-dir build --output-on-failure -C Release -j4 -E test_media_loopback

      # qmllint over the whole QML tree, using the aqt-installed Qt and the
      # build directory's generated qmldir/qmltypes so C++-registered types
      # and the BSFChat module resolve.
      #
      # continue-on-error for now: .qmllint.ini promotes `unqualified` and
      # `missing-property` to errors, and the existing tree trips both in
      # bulk. Workstreams B (QML crash/correctness) and F are clearing that
      # backlog; REMOVE `continue-on-error` and this comment once the count
      # reaches zero, so a new unguarded-null TypeError fails the build
      # instead of shipping green.
      - name: qmllint
        if: matrix.platform == 'macos'
        continue-on-error: true
        shell: bash
        run: |
          QMLLINT="$QT_ROOT_DIR/bin/qmllint"
          "$QMLLINT" --version
          # `find` rather than a glob: qml/ is three levels deep in places.
          "$QMLLINT" -I build $(find qml -name '*.qml' | sort)

      # === macOS: Import signing certificate ===
      - name: Import code signing certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          # codesign: as well as apple-tool:/apple:. Apple's own sample
          # omits it, and with it omitted `codesign` is not on the key's
          # ACL — so instead of failing, it blocks on a GUI keychain
          # prompt that a headless runner can never answer, and the job
          # hangs until the six-hour timeout. Cheap to include, and the
          # failure it prevents is the most expensive kind.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          # Extract identity name for codesign
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      # === macOS: Create .dmg ===
      - name: Package macOS .dmg
        if: matrix.platform == 'macos'
        run: |
          cd build
          # Find the .app bundle
          APP_PATH=$(find . -name "bsfchat-app.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            find . -name "bsfchat-app*" -type f
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          # V-H4: the microphone/camera permission backends are STATIC Qt
          # plugins, linked (or not) at configure time depending on
          # whether the target's Info.plist already carries the matching
          # usage description. When that link silently does not happen —
          # which is how 0.0.44-rc.7 shipped — the app logs "Could not
          # find permission plugin for QMicrophonePermission", every
          # permission query answers Denied, macOS never prompts and
          # never lists the app under Privacy & Security, and voice joins
          # with a mic that only ever records silence. macdeployqt cannot
          # fix this afterwards: there is no dylib to copy. So check the
          # shipped artefact, not the source.
          for key in NSMicrophoneUsageDescription NSCameraUsageDescription \
                     NSScreenCaptureUsageDescription; do
            /usr/libexec/PlistBuddy -c "print $key" "$APP_PATH/Contents/Info.plist" \
              || { echo "ERROR: $key missing from the bundle's Info.plist"; exit 1; }
          done
          for plugin in QDarwinMicrophonePermissionPlugin QDarwinCameraPermissionPlugin; do
            if ! nm -a "$APP_PATH/Contents/MacOS/bsfchat-app" | grep -q "$plugin"; then
              echo "ERROR: $plugin is not linked into the binary — permissions will read as denied"
              exit 1
            fi
          done
          echo "Permission plugins linked and usage descriptions present"
          # Deploy Qt frameworks and QML modules into the bundle
          macdeployqt "$APP_PATH" -always-overwrite -qmldir=${{ github.workspace }}/qml -verbose=2
          # Ensure QML modules are copied (macdeployqt often misses them)
          QT_QML_DIR="${QML2_IMPORT_PATH:-$(dirname $(dirname $(which macdeployqt)))/qml}"
          echo "Looking for QML modules in: $QT_QML_DIR"
          if [ -d "$QT_QML_DIR" ]; then
            echo "Copying QML modules from $QT_QML_DIR"
            QML_DEST="$APP_PATH/Contents/Resources/qml"
            mkdir -p "$QML_DEST"
            for mod in QtQuick QtQml Qt/labs; do
              if [ -d "$QT_QML_DIR/$mod" ]; then
                cp -R "$QT_QML_DIR/$mod" "$QML_DEST/"
                echo "  Copied $mod"
              fi
            done
            echo "QML modules copied: $(ls $QML_DEST/)"
          else
            echo "WARNING: QML dir not found at $QT_QML_DIR"
            # Try finding it
            find /Users/runner -name "QtQuick" -type d -path "*/qml/*" 2>/dev/null | head -3
          fi
          # Strip build intermediates that Qt 6.11's QML modules ship
          # inside their deployed dirs (e.g. Qt.labs.assetdownloader
          # carries objects-*/**.cpp.o and .qt/rcc artifacts). They have
          # no runtime purpose, but they ARE Mach-O objects, so the
          # notary rejects the bundle with "binary is not signed / no
          # secure timestamp" for each one. Remove them before signing.
          find "$APP_PATH/Contents/Resources/qml" \
            \( -name '*.o' -o -name '*.a' -o -name 'objects-*' -o -name '.qt' \) \
            -exec rm -rf {} + 2>/dev/null || true
          # Set qt.conf to tell Qt where QML modules are
          cat > "$APP_PATH/Contents/Resources/qt.conf" << 'QTCONF'
          [Paths]
          Plugins = PlugIns
          Imports = Resources/qml
          QmlImports = Resources/qml
          QTCONF
          # === Code sign with hardened runtime + entitlements ===
          #
          # The bundle has to pass the notary service, which requires
          # every Mach-O inside it to be signed by us with the same
          # identity, hardened runtime enabled, a secure timestamp,
          # and our entitlements. We walk leaves-first because
          # codesign refuses to overwrite a signed container before
          # the contents are signed (`--deep` does this implicitly
          # but is unreliable — it skips items it thinks are already
          # signed, leaving Qt frameworks with macdeployqt's adhoc
          # signature instead of ours).
          ENTITLEMENTS="$GITHUB_WORKSPACE/macos/BSFChat.entitlements"
          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "ERROR: entitlements file missing at $ENTITLEMENTS"
            exit 1
          fi

          sign_one() {
            codesign --force \
                     --options runtime \
                     --timestamp \
                     --entitlements "$ENTITLEMENTS" \
                     --sign "$CODESIGN_IDENTITY" \
                     "$1"
          }

          if [ -n "$CODESIGN_IDENTITY" ]; then
            echo "Signing with identity: $CODESIGN_IDENTITY"
            # 1. Loose dylibs / .so files (deepest path first so a
            #    framework's binary gets signed before its container).
            while IFS= read -r f; do
              [ -n "$f" ] && sign_one "$f"
            done < <(find "$APP_PATH" \( -name "*.dylib" -o -name "*.so" \) -type f | sort -r)
            # 2. Framework bundles (each as a unit — codesign on a
            #    *.framework dir signs Versions/A correctly).
            while IFS= read -r d; do
              [ -n "$d" ] && sign_one "$d"
            done < <(find "$APP_PATH" -name "*.framework" -type d | sort -r)
            # 3. Main executable.
            sign_one "$APP_PATH/Contents/MacOS/bsfchat-app"
            # 4. Outer .app bundle.
            sign_one "$APP_PATH"
            # Verify the whole bundle is internally consistent before
            # we ship it to the notary service. --strict catches the
            # most common notarisation rejections at build time.
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            echo "Bundle signed and verified"
          else
            echo "No Developer ID identity available — adhoc signing (won't notarize)"
            codesign --force --deep --sign - "$APP_PATH"
          fi
          # Create .dmg
          create-dmg \
            --volname "BSFChat" \
            --window-size 600 400 \
            --icon "$(basename $APP_PATH)" 175 200 \
            --app-drop-link 425 200 \
            --no-internet-enable \
            "BSFChat-macOS.dmg" "$APP_PATH" || true
          # Fallback to zip
          if [ ! -f "BSFChat-macOS.dmg" ]; then
            ditto -c -k --keepParent "$APP_PATH" BSFChat-macOS.dmg
          fi
          # Sign the DMG envelope itself. Gatekeeper validates the
          # outer container's signature separately from the .app's
          # signature inside; an unsigned DMG triggers "from an
          # unidentified developer" even when its payload is signed.
          if [ -n "$CODESIGN_IDENTITY" ] && [ -f BSFChat-macOS.dmg ]; then
            codesign --force --sign "$CODESIGN_IDENTITY" --timestamp BSFChat-macOS.dmg
            echo "DMG envelope signed"
          fi

      # === macOS: Notarize + staple ===
      # Run as its own step so the failure mode is legible in the UI
      # ("Notarize macOS .dmg" red) instead of buried inside the
      # 200-line packaging script. Soft-fails when secrets are absent
      # so PRs from forks (which don't get repo secrets) still
      # produce a usable signed-but-unstapled DMG.
      - name: Notarize macOS .dmg
        if: matrix.platform == 'macos'
        env:
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID:         ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID:      ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          DMG="$GITHUB_WORKSPACE/build/BSFChat-macOS.dmg"
          if [ ! -f "$DMG" ]; then
            echo "ERROR: DMG not found at $DMG"
            exit 1
          fi
          if [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::warning::Skipping notarisation — no Developer ID identity (likely a fork PR without MACOS_CERTIFICATE)."
            exit 0
          fi
          if [ -z "$NOTARY_API_KEY_BASE64" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::warning::Skipping notarisation — NOTARY_API_KEY_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID secrets unset."
            exit 0
          fi

          # Materialise the App Store Connect API key from the
          # base64-encoded secret. The .p8 must live on disk because
          # notarytool reads it by path, not by environment variable.
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Submit. --wait blocks until Apple's verdict comes back
          # (typically 1–5 minutes) and exits non-zero on rejection.
          # On rejection, fetch the log so we can see which binary
          # is the problem instead of just "Invalid".
          echo "Submitting $DMG to Apple notary service…"
          SUBMIT_OUT=$(xcrun notarytool submit "$DMG" \
            --key    "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json) || NOTARY_RC=$?

          echo "$SUBMIT_OUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarisation failed (status=$STATUS, id=$SUBMISSION_ID). Fetching log…"
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key    "$KEY_PATH" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" || true
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi

          # Staple the ticket into the DMG so Gatekeeper validates
          # offline. Without this, the user's Mac has to phone home
          # to Apple on first launch — works while online but fails
          # silently if the user is offline / behind a captive
          # portal.
          xcrun stapler staple "$DMG"

          # Final sanity check: spctl is what Gatekeeper itself uses.
          # If this passes, the DMG will open cleanly on a fresh Mac.
          spctl --assess --type open \
                --context context:primary-signature \
                --verbose "$DMG"

          rm -f "$KEY_PATH"
          echo "Notarisation + stapling complete"

      - name: Upload macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-macOS
          path: build/BSFChat-macOS.dmg

      # === Windows: Prepare Authenticode signing ===
      # Mirrors the macOS notarisation soft-fail pattern: when the
      # WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD secrets are
      # absent (fork PRs, or signing simply not set up yet) we log a
      # notice and produce an unsigned build — the job still passes.
      # When present, the .pfx is materialised into RUNNER_TEMP and
      # WINDOWS_PFX_PATH / SIGNTOOL_PATH are exported for the
      # packaging + installer-signing steps below.
      - name: Prepare Windows signing certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "::notice::Skipping Authenticode signing - WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD secrets unset (likely a fork PR or signing not configured). Artifacts will be unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "authenticode.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          # signtool ships with the Windows SDK on the hosted runners;
          # pick the newest x64 copy.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "::warning::signtool.exe not found on runner - Authenticode signing will be skipped."
            exit 0
          }
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_PFX_PATH=$pfx"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL_PATH=$($signtool.FullName)"
          Write-Host "Authenticode signing enabled (signtool: $($signtool.FullName))"

      # === Windows: Create NSIS installer ===
      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          mkdir dist
          # Find the exe (could be in Release/ or directly in build/)
          $exe = Get-ChildItem -Path build -Recurse -Filter "bsfchat-app.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "bsfchat-app.exe not found"; exit 1 }
          Write-Host "Found exe at: $($exe.FullName)"
          Copy-Item $exe.FullName dist\
          windeployqt --release --no-translations --qmldir qml dist\bsfchat-app.exe

          # Copy runtime DLLs that windeployqt doesn't handle
          # OpenSSL (from Qt installation or vcpkg/system)
          $openssl_dlls = @("libssl-3-x64.dll", "libcrypto-3-x64.dll")
          $search_paths = @(
            $env:QT_ROOT_DIR,
            "${env:IQTA_TOOLS}\..",
            "D:\a\client\Qt",
            "C:\vcpkg\installed\x64-windows\bin",
            "C:\Program Files\OpenSSL-Win64\bin",
            "C:\Program Files\Common Files\SSL",
            "${env:ProgramFiles}"
          ) | Where-Object { $_ -and (Test-Path $_ -ErrorAction SilentlyContinue) }

          foreach ($dll in $openssl_dlls) {
            $found = $null
            foreach ($path in $search_paths) {
              $found = Get-ChildItem -Path $path -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { break }
            }
            if ($found) {
              Copy-Item $found.FullName dist\
              Write-Host "Copied $dll from $($found.FullName)"
            } else {
              Write-Warning "Could not find $dll"
            }
          }

          # Opus (from our build - FetchContent puts it somewhere in build/_deps)
          $opus_dll = Get-ChildItem -Path build -Recurse -Filter "opus.dll" | Select-Object -First 1
          if ($opus_dll) {
            Copy-Item $opus_dll.FullName dist\
            Write-Host "Copied opus.dll from $($opus_dll.FullName)"
          } else {
            Write-Warning "Could not find opus.dll"
          }

          # libdatachannel DLL
          $dc_dll = Get-ChildItem -Path build -Recurse -Filter "datachannel*.dll" | Select-Object -First 1
          if ($dc_dll) {
            Copy-Item $dc_dll.FullName dist\
            Write-Host "Copied $($dc_dll.Name)"
          }

          # FFmpeg runtime DLLs for QtMultimedia's FFmpeg backend.
          # QScreenCapture (the engine behind ScreenShareController on
          # Windows/Linux) loads this backend at runtime; without
          # av*/sw*/postproc DLLs the backend silently fails to
          # initialise and screen-share calls become no-ops. windeployqt
          # bundles the Qt-side plugin (multimedia\ffmpegmediaplugin.dll)
          # but NOT the underlying FFmpeg runtime DLLs.
          $qtBin = "${env:QT_ROOT_DIR}\bin"
          if (Test-Path $qtBin) {
            $patterns = @("av*.dll", "sw*.dll", "postproc*.dll")
            $copied = 0
            foreach ($pat in $patterns) {
              Get-ChildItem -Path $qtBin -Filter $pat -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName dist\
                $copied++
              }
            }
            Write-Host "Copied $copied FFmpeg DLL(s) from $qtBin"
          } else {
            Write-Warning "QT_ROOT_DIR\bin not found ($qtBin); QScreenCapture will fail at runtime"
          }
          # Verify the QtMultimedia FFmpeg plugin made it in via
          # windeployqt — without it the runtime backend doesn't load
          # even when av*.dll are present.
          $plug = Get-ChildItem -Path dist -Recurse -Filter "ffmpegmediaplugin*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $plug) {
            Write-Warning "ffmpegmediaplugin.dll missing from dist — windeployqt didn't pull the QtMultimedia FFmpeg plugin; screen-share will be broken"
          } else {
            Write-Host "QtMultimedia FFmpeg plugin present: $($plug.FullName)"
          }

          # MSVC runtime (usually handled by windeployqt, but be safe)
          Write-Host "Final dist contents:"
          Get-ChildItem dist\ | Select-Object Name, Length

          # Authenticode-sign the app exe BEFORE makensis packs it into
          # the installer (the installer envelope gets its own signature
          # in the follow-up step). Soft-fail scaffold: no-ops when the
          # signing secrets weren't configured.
          if ($env:WINDOWS_PFX_PATH -and $env:SIGNTOOL_PATH) {
            & $env:SIGNTOOL_PATH sign /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\bsfchat-app.exe
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on bsfchat-app.exe"; exit 1 }
            Write-Host "Signed dist\bsfchat-app.exe"
          } else {
            Write-Host "bsfchat-app.exe left unsigned (no signing certificate configured)"
          }

          Copy-Item installer.nsi dist\
          # Brand icon for the NSIS installer chrome. installer.nsi
          # references "BSFChat.ico" relative to the .nsi file, so
          # ship it next to the script in dist\.
          Copy-Item branding\BSFChat.ico dist\
          cd dist
          # /D defines pass through to the .nsi as `${BSFCHAT_VERSION}`
          # tokens, which feed VIProductVersion + the DisplayVersion
          # registry write.
          makensis "/DBSFCHAT_VERSION=${{ steps.version.outputs.version }}" "/DBSFCHAT_VERSION_NSIS=${{ steps.version.outputs.version_nsis }}" installer.nsi

      # === Windows: Sign installer ===
      # Own step so a signing failure is legible in the UI (same
      # rationale as the macOS notarise step). Soft-fails to "unsigned
      # but shippable" when the secrets are absent.
      - name: Sign Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $setup = "dist\BSFChat-Setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "$setup not found"; exit 1 }
          if (-not $env:WINDOWS_PFX_PATH -or -not $env:SIGNTOOL_PATH) {
            Write-Host "::notice::BSFChat-Setup.exe left unsigned - signing secrets not configured."
            exit 0
          }
          & $env:SIGNTOOL_PATH sign /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool failed on BSFChat-Setup.exe"; exit 1 }
          & $env:SIGNTOOL_PATH verify /pa $setup
          if ($LASTEXITCODE -ne 0) { Write-Error "signature verification failed"; exit 1 }
          Write-Host "Installer signed and verified"

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-Windows
          path: dist/BSFChat-Setup.exe

      # === Linux: Create tarball ===
      # Self-contained bundle: Qt shared libs + plugins + QML imports
      # travel with the binary. Historically we created lib/ and
      # plugins/ and pointed the launch script at them but never
      # populated them — anyone without a matching system Qt got a
      # silent failure, and QtMultimedia's FFmpeg backend (screen and
      # camera capture) is essentially never present system-wide.
      # Plain ldd + cp on purpose: explicit, verifiable, and no
      # linuxdeployqt dependency.
      - name: Package Linux tarball
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          QT_DIR="${QT_ROOT_DIR:?install-qt-action did not export QT_ROOT_DIR}"
          mkdir -p BSFChat/bin BSFChat/lib BSFChat/plugins BSFChat/qml BSFChat/share
          cp build/bsfchat-app BSFChat/bin/

          # --- Qt runtime plugins -------------------------------------
          # platforms/xcbglintegrations/wayland-*: display; multimedia:
          # the FFmpeg capture/playback backend; tls: HTTPS for the
          # Matrix client; the rest are the usual suspects Qt loads
          # lazily and fails without.
          for p in platforms multimedia imageformats iconengines tls \
                   xcbglintegrations platforminputcontexts platformthemes \
                   egldeviceintegrations wayland-decoration-client \
                   wayland-graphics-integration-client \
                   wayland-shell-integration; do
            if [ -d "$QT_DIR/plugins/$p" ]; then
              cp -a "$QT_DIR/plugins/$p" BSFChat/plugins/
              echo "plugins: $p"
            fi
          done

          # --- QML import dirs ----------------------------------------
          # The app's own QML is compiled into the binary via
          # qt_add_qml_module; only the Qt-provided modules it imports
          # need shipping (QtQuick[.Controls/Layouts/Dialogs/Effects/
          # Window], QtQml, QtMultimedia, Qt.labs.platform).
          for m in QtQuick QtQml QtMultimedia QtCore; do
            if [ -d "$QT_DIR/qml/$m" ]; then
              cp -a "$QT_DIR/qml/$m" BSFChat/qml/
              echo "qml: $m"
            fi
          done
          if [ -d "$QT_DIR/qml/Qt/labs/platform" ]; then
            mkdir -p BSFChat/qml/Qt/labs
            cp -a "$QT_DIR/qml/Qt/labs/platform" BSFChat/qml/Qt/labs/
            echo "qml: Qt/labs/platform"
          fi

          # --- Shared libraries ---------------------------------------
          # ldd sweep over the app binary plus every bundled plugin and
          # QML plugin .so, iterated to a fixpoint so transitive deps
          # (icu, FFmpeg's libav*/libsw*, Qt private helpers) land in
          # lib/ too. Only libs resolved from the Qt tree or our build
          # tree are taken — glibc/libstdc++/X11 stay system-provided
          # to avoid ABI mismatches on the target machine.
          export LD_LIBRARY_PATH="$QT_DIR/lib"
          copy_deps() {
            # `|| true`: ldd exits non-zero on non-ELF input, which
            # must not abort the sweep under pipefail.
            ldd "$1" 2>/dev/null | awk '/=>/ { print $3 }' | while read -r lib; do
              [ -n "$lib" ] || continue
              case "$lib" in
                "$QT_DIR"/*|"$GITHUB_WORKSPACE"/build/*)
                  base=$(basename "$lib")
                  if [ ! -e "BSFChat/lib/$base" ]; then
                    cp -L "$lib" "BSFChat/lib/$base"
                    echo "lib: $base"
                  fi
                  ;;
              esac
            done || true
          }
          prev=-1
          count=0
          while [ "$count" != "$prev" ]; do
            prev="$count"
            copy_deps BSFChat/bin/bsfchat-app
            find BSFChat/plugins BSFChat/qml BSFChat/lib -name '*.so*' -type f 2>/dev/null \
              | while read -r so; do copy_deps "$so"; done
            count=$(ls BSFChat/lib | wc -l)
          done
          echo "Bundled $(ls BSFChat/lib | wc -l) shared libraries"

          # Brand icon — placed at share/BSFChat.png so the
          # generated .desktop file's `Icon=` entry resolves
          # whether the user installs into ~/.local/share/ via
          # xdg-desktop-menu or just runs from the extracted dir.
          cp branding/BSFChat.png BSFChat/share/
          cat > BSFChat/share/bsfchat.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=BSFChat
          GenericName=Chat
          Comment=Self-hosted Discord-style chat
          Exec=bsfchat.sh %u
          Icon=BSFChat
          Terminal=false
          Categories=Network;InstantMessaging;Chat;
          MimeType=x-scheme-handler/bsfchat;
          DESKTOP
          # Create a simple launch script
          #
          # BSFCHAT_BUNDLE_DIR / BSFCHAT_HOST_LD_LIBRARY_PATH are not
          # decoration. Everything below is inherited by every process the
          # app spawns, and the app spawns one that matters: the browser,
          # for BSFChat ID sign-in. xdg-open is a shell script that execs
          # the user's real browser, which then starts with OUR libicu,
          # libssl and libav* ahead of its own and dies on a symbol
          # mismatch — silently, because the spawn itself succeeded. So we
          # record what the session's LD_LIBRARY_PATH was BEFORE this line
          # changes it, and src/util/ExternalBrowser.cpp puts it back for
          # the browser. Recorded even when empty: "was not set" and "we
          # never looked" have to be distinguishable, and the marker is
          # what tells the app it is running from this bundle at all.
          cat > BSFChat/bsfchat.sh << 'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export BSFCHAT_BUNDLE_DIR="$DIR"
          export BSFCHAT_HOST_LD_LIBRARY_PATH="${LD_LIBRARY_PATH-}"
          export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$DIR/plugins"
          export QML2_IMPORT_PATH="$DIR/qml${QML2_IMPORT_PATH:+:$QML2_IMPORT_PATH}"
          export QML_IMPORT_PATH="$DIR/qml${QML_IMPORT_PATH:+:$QML_IMPORT_PATH}"
          exec "$DIR/bin/bsfchat-app" "$@"
          SCRIPT
          chmod +x BSFChat/bsfchat.sh
          tar czf BSFChat-linux-x86_64.tar.gz BSFChat/

      # Mirror of the Windows job's ffmpegmediaplugin check: fail the
      # job when the bits screen-share depends on are missing from the
      # tarball, warn on the softer FFmpeg-runtime case.
      - name: Verify Linux bundle
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          tar tzf BSFChat-linux-x86_64.tar.gz > /tmp/tar-contents.txt
          fail=0
          for want in \
            "BSFChat/lib/libQt6Core.so" \
            "BSFChat/lib/libQt6Multimedia.so" \
            "BSFChat/plugins/multimedia/" \
            "BSFChat/plugins/platforms/libqxcb.so" \
            "BSFChat/qml/QtQuick/"; do
            if ! grep -q "$want" /tmp/tar-contents.txt; then
              echo "::error::Linux bundle is missing $want — end users without a matching system Qt will get a broken app"
              fail=1
            fi
          done
          if ! grep -q "BSFChat/plugins/multimedia/libffmpegmediaplugin.so" /tmp/tar-contents.txt; then
            echo "::error::QtMultimedia FFmpeg plugin missing from bundle — screen/camera capture will silently no-op"
            fail=1
          fi
          if ! grep -q "BSFChat/lib/libavcodec" /tmp/tar-contents.txt; then
            echo "::warning::libavcodec not bundled — QtMultimedia's FFmpeg backend may fail to initialise at runtime"
          fi
          [ "$fail" -eq 0 ]
          echo "Linux bundle verification passed"

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-Linux
          path: BSFChat-linux-x86_64.tar.gz

  # === Android ===
  #
  # Its own job rather than a fourth entry in the `build` matrix: the
  # Android build needs a CROSS Qt plus a HOST Qt, an NDK, a pinned SDK
  # platform and a JDK, and none of the desktop packaging (dmg, NSIS,
  # the ldd sweep) applies to it. Folded into the matrix it would have
  # put an `if:` on nearly every step over there.
  #
  # Outputs, both from one compile:
  #   * APK  — every build, uploaded as an artifact for sideloading.
  #   * AAB  — tags only. Play has required the App Bundle format for
  #            new apps since 2021; an APK cannot be uploaded to a
  #            Play listing at all, only handed round directly.
  #
  # Not gated on `build`, same reasoning as `sanitizers`: an Android
  # packaging break should be visible even when the desktop jobs are
  # red, and vice versa.
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so cmake/Version.cmake's git-describe
          # fallback works for non-tag pushes, exactly as in `build`.
          fetch-depth: 0

      # Same grammar and the same -dev suffix rule as the build job's
      # "Derive version" step — keep the two in step. Android also
      # needs the versionCode, which cmake/Version.cmake derives from
      # the version string (final releases land on a multiple of 100,
      # rc.N in the 99-wide band just below it) so nothing to compute
      # here beyond the name.
      - name: Derive version
        id: version
        shell: bash
        run: |
          # A manual run may name the version explicitly. That is the
          # only way to produce an uploadable artefact from a branch:
          # a derived "<tag>-dev.<sha>" version maps to the SAME Android
          # versionCode as the eventual release (cmake/Version.cmake
          # says so and warns), so uploading one burns that release's
          # number permanently. Requiring the operator to type it makes
          # the hazard a decision rather than an accident.
          MANUAL="${{ inputs.version }}"
          if [ -n "$MANUAL" ]; then
            if ! [[ "$MANUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::version input '$MANUAL' is not MAJOR.MINOR.PATCH[-suffix]"
              exit 1
            fi
            VER="$MANUAL"
            echo "Version from workflow_dispatch input: $VER"
          else
            REF="${GITHUB_REF_NAME:-}"
            if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              VER="${REF#v}"
            else
              LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
              LAST="${LAST#v}"
              VER="${LAST}-dev.$(git rev-parse --short HEAD)"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "BSFChat version: $VER"

      # JDK 17: what Qt 6.10 documents for its Gradle/AGP 8.10.1
      # toolchain. The runner's default JDK drifts; pin it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # platforms;android-36 is not optional — Play has required
      # targetSdk 36 for new apps AND updates since 2026-08-31, AGP
      # wants compileSdk >= targetSdk, and androiddeployqt picks
      # compileSdk from the newest platform installed here. Without
      # this step the build silently compiles against whatever the
      # runner image happens to ship.
      #
      # NDK r27c (27.2.12479018) is the version Qt 6.10's official
      # Android libraries were built with; Qt's own docs warn that a
      # mismatch shows up as missing symbols at link time. Bump this
      # together with the Qt version below, never separately.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Two Qt installs, both pinned to an explicit `dir` so the paths
      # below are deterministic rather than depending on whichever of
      # them set QT_ROOT_DIR last:
      #   host  -> $GITHUB_WORKSPACE/Qt/6.10.3/gcc_64  (moc, rcc,
      #            qmlimportscanner — androiddeployqt runs these on the
      #            builder, so they must be host binaries)
      #   cross -> $GITHUB_WORKSPACE/Qt/6.10.3/android_arm64_v8a
      # Version stays in lockstep with the desktop `build` job — see the
      # long comment there for why 6.10.3 and not 6.8/6.11.
      - name: Install Qt (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia'
          dir: ${{ github.workspace }}
          cache: true
          set-env: false

      # host: all_os, NOT linux. Qt moved the Android binaries out of the
      # per-host trees in 6.7: everything from 6.8 onwards lives under
      # qtsdkrepository/all_os/android/qt6_<ver>/, and linux_x64/android/
      # stops at 6.6.3. Asking aqt for `linux android 6.10.3` therefore
      # resolves nothing at all and the action fails with "No available
      # Qt version found by specified inputs" — which is exactly how this
      # job failed on its first run. The arch name itself was right.
      - name: Install Qt (android arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia'
          dir: ${{ github.workspace }}
          cache: true
          set-env: false

      # ninja-build is not in the ubuntu-24.04 runner image, and the
      # CMake pin is the same one the desktop Linux job carries: several
      # FetchContent'd deps still trip CMake 4's cmake_minimum_required
      # floor even with CMAKE_POLICY_VERSION_MINIMUM set.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          pip3 install --break-system-packages cmake==3.30.5

      # Qt for Android ships no TLS backend, so OIDC token exchange,
      # the Matrix client and every media fetch fail silently at the
      # TLS layer unless we package our own libssl/libcrypto. deps/ is
      # gitignored, same contract as the desktop jobs' openh264 step.
      - name: Build vendored OpenSSL for Android
        run: bash scripts/build-openssl-android.sh

      - name: Configure
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          QT_ANDROID="$GITHUB_WORKSPACE/Qt/6.10.3/android_arm64_v8a"
          cmake -B build-android -G Ninja -Wno-dev \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ANDROID/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$GITHUB_WORKSPACE/Qt/6.10.3/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_ABI=arm64-v8a \
            -DGAMECHAT_CLIENT_BUILD_TESTS=OFF \
            -DBSFCHAT_BUNDLE_ID=com.bsfchat.app \
            -DBSFCHAT_VERSION="${{ steps.version.outputs.version }}"

      # -j4 to match the desktop jobs. No ctest step: the client test
      # suite is host-architecture and there is no device to run it on
      # (an emulator on a hosted runner is both slow and flaky). The
      # desktop matrix is what gates correctness; this job gates
      # "does the Android artefact build and carry the right identity".
      #
      # Two invocations on purpose. The default (ALL) target builds the
      # native library and nothing else: Qt's APK target is created by
      # qt6_android_add_apk_target as a plain add_custom_target, NOT part
      # of ALL, so `cmake --build .` alone leaves no .apk anywhere and
      # the verification below has nothing to inspect. androiddeployqt
      # itself is single-threaded, hence no -j on the second call.
      - name: Build APK
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cmake --build build-android --config Release -j4
          cmake --build build-android --config Release --target bsfchat-app_make_apk

      # Guard the two things that are IRREVERSIBLE once an artefact
      # reaches the Play Console. The application id is locked to the
      # listing forever at first upload, and a versionCode is burned
      # permanently the moment any track sees it — so assert them on
      # the built artefact rather than trusting the source.
      - name: Verify APK identity
        run: |
          set -euo pipefail
          # Resolve the release APK, but insist it is UNIQUE. A bare
          # `find -name "*.apk" | head -1` also matches the debug APK and
          # Gradle's intermediates, and which one it returns is
          # filesystem order — i.e. the verification could pass on a
          # different file than the one we ship. Hard-coding the full
          # path is no better: Qt's androiddeployqt output directory is
          # version-dependent (android-build vs android-build-<target>),
          # so a pinned path silently means "no APK" on a Qt bump. The
          # release/ path segment plus a one-match assertion gives the
          # determinism without the brittleness. Same for the bundle
          # further down.
          mapfile -t APKS < <(find build-android \
            -path '*/build/outputs/apk/release/*-release-unsigned.apk' | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 release APK, found ${#APKS[@]}"
            find build-android -name '*.apk'
            exit 1
          fi
          APK="${APKS[0]}"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK: $APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -5
          PKG=$(echo "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          TGT=$(echo "$BADGING" | sed -n "s/.*targetSdkVersion:'\([^']*\)'.*/\1/p")
          if [ "$PKG" != "com.bsfchat.app" ]; then
            echo "::error::application id is '$PKG', expected com.bsfchat.app." \
                 "Play locks this permanently at first upload — do not ship this."
            exit 1
          fi
          if [ "${TGT:-0}" -lt 36 ]; then
            echo "::error::targetSdkVersion is '$TGT'; Play requires >= 36 for" \
                 "new apps and updates since 2026-08-31."
            exit 1
          fi
          # 64-bit coverage: Play requires a 64-bit native library for
          # every 32-bit one. We ship arm64-v8a only, so assert that the
          # native libs really landed under it.
          # Prefix match, not the full file name: Qt appends the ABI to
          # the library's basename in a multi-ABI build and does not in a
          # single-ABI one, and which of those we are in is Qt's choice,
          # not ours. What matters here is that OUR native library landed
          # under lib/arm64-v8a/ at all.
          if ! unzip -l "$APK" | grep -qE "lib/arm64-v8a/libbsfchat-app[^/]*\.so"; then
            echo "::error::no arm64-v8a native library in the APK"
            exit 1
          fi
          if unzip -l "$APK" | grep -qE "lib/(armeabi-v7a|x86)/"; then
            echo "::error::32-bit ABI present without a matching 64-bit build"
            exit 1
          fi
          # Surface the two numbers a human has to reconcile with the
          # Play Console by hand. A versionCode is burned permanently by
          # an upload to ANY track, including internal testing, and the
          # next upload must be strictly greater — so whoever is about
          # to drag a bundle into the Console needs to read this off the
          # artefact, not off the source or off their memory of the tag.
          VC=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          VN=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          # aapt2 from build-tools 36 prints this as `minSdkVersion:'28'`;
          # older ones printed a bare `sdkVersion:'28'`. Accept either —
          # this one is display-only (the table below), but a blank cell
          # is exactly the sort of thing a human reconciling the Console
          # by hand should not have to guess at.
          MIN=$(echo "$BADGING" | sed -n "s/^\(min\)\{0,1\}[sS]dkVersion:'\([^']*\)'.*/\2/p" | head -1)
          {
            echo "### Android artefact"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| application id | \`$PKG\` |"
            echo "| versionCode | **$VC** (burned permanently on upload) |"
            echo "| versionName | \`$VN\` |"
            echo "| minSdk / targetSdk | $MIN / $TGT |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK identity OK: $PKG $VN ($VC) minSdk=$MIN targetSdk=$TGT arm64-v8a"

      # The `secrets` context cannot be read from a step-level `if`, and a
      # step's own `env:` block is not applied until after its `if` is
      # evaluated — so presence has to be turned into a plain output here
      # before the two steps below can branch on it.
      - name: Check for signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Signing is best-effort on branch/PR builds: forks and Dependabot
      # runs get no secrets, and a missing keystore must not turn the
      # whole job red. On tags it is NOT optional — see the gate below.
      - name: Sign APK
        id: sign_apk
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # APK_PATH is the path the verification step already resolved
          # and asserted on — sign that exact file, not a second guess.
          bash scripts/sign-android.sh "$APK_PATH" "$GITHUB_WORKSPACE/BSFChat-android-arm64.apk"

      - name: Stage unsigned APK
        if: steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          cp "$APK_PATH" "$GITHUB_WORKSPACE/BSFChat-android-arm64-unsigned.apk"
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this APK is" \
               "UNSIGNED and cannot be installed without signing it first."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-Android-APK
          path: BSFChat-android-arm64*.apk

      # === App Bundle: tag builds, or a manual run that asks for it ===
      # The .aab is the only format Play accepts for the listing. It is
      # built from the same tree that produced the APK above, so the
      # identity assertions already passed for these bits.
      #
      # There is deliberately NO upload-to-Play step anywhere in this
      # job, and that is not an omission. Google will not accept an
      # app's first bundle through the Play Developer API — the app
      # record has to exist and have had one release uploaded by a human
      # before the API will talk to it — so the first Play upload is a
      # person dragging this artefact into the Console. See
      # docs/store-submission-runbook.md. Automating later uploads means
      # adding a service-account JSON secret; do that once the manual
      # path has worked at least once.
      - name: Build AAB
        if: startsWith(github.ref, 'refs/tags/v') || inputs.android_aab
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cmake --build build-android --config Release --target bsfchat-app_make_aab

      # Hard failure, not a warning: a tag that publishes an unsigned
      # bundle is a release nobody can upload, and it would be noticed
      # only in the Play Console.
      - name: Sign AAB
        if: startsWith(github.ref, 'refs/tags/v') || inputs.android_aab
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Tag build with no ANDROID_KEYSTORE_BASE64 secret." \
                 "Create the upload-keystore secrets before tagging —" \
                 "see docs/android-release.md."
            exit 1
          fi
          # RELEASE bundle specifically: the same target also emits a
          # debug .aab and a much larger intermediary-bundle.aab, and
          # signing/uploading either of those would be silently wrong.
          # Resolved-and-unique, same reasoning as the APK above.
          mapfile -t AABS < <(find build-android \
            -path '*/build/outputs/bundle/release/*.aab' | sort)
          if [ "${#AABS[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 release AAB, found ${#AABS[@]}"
            find build-android -name '*.aab'
            exit 1
          fi
          bash scripts/sign-android.sh "${AABS[0]}" "$GITHUB_WORKSPACE/BSFChat-android.aab"

      - name: Upload AAB artifact
        if: startsWith(github.ref, 'refs/tags/v') || inputs.android_aab
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-Android-AAB
          path: BSFChat-android.aab

  # ASan+UBSan over the client test targets, mirroring the server's
  # `sanitizers` job. The teardown use-after-free in
  # ~PeerConnectionManager (V-C2 in PLAN-2026-09.md) is exactly the class
  # of bug an unsanitized ctest run reports as "all tests passed", and
  # test_media_loopback exercises that path.
  #
  # macOS-only: this is where the voice/video stack is developed and where
  # the platform capture code lives. Not gated on `build` — a sanitizer
  # failure should be visible even when packaging is broken, and vice
  # versa.
  sanitizers:
    name: asan+ubsan (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Keep in lockstep with the build job above.
          version: '6.10.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Install dependencies
        run: |
          brew install openssl@3 nasm
          pip3 install --break-system-packages cmake==3.30.5

      - name: Build vendored openh264
        run: bash scripts/build-openh264.sh

      - name: Configure
        # -O1 + frame pointers: readable stack traces without the
        # sanitized build taking all afternoon.
        # -fno-sanitize-recover=undefined makes UB fail the run rather
        # than print and continue.
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -Wno-dev \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DGAMECHAT_CLIENT_BUILD_TESTS=ON \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan -j4

      - name: Test
        env:
          # No detect_leaks: LeakSanitizer is not available on macOS/arm64.
          # Qt singletons and QML engine caches are also torn down after
          # main() returns, which makes leak reports noisy here.
          ASAN_OPTIONS: abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        # test_media_loopback: non-gating on hosted runners, see the Test step above.
        run: ctest --test-dir build-asan --output-on-failure -j4 -E test_media_loopback

  # === iOS: device archive → .ipa → TestFlight ===
  #
  # A separate job rather than a fourth entry in the `build` matrix: it
  # shares almost none of that job's steps. It needs TWO Qt installs
  # (target + host), the Xcode generator instead of Ninja, no ctest (the
  # test targets are host binaries), and a signing/packaging path with
  # nothing in common with .dmg or NSIS.
  #
  # This job used to carry continue-on-error: true, on the grounds that
  # brand-new iOS CI going red should not block a desktop release. That
  # was not what it did. continue-on-error at JOB level does not mark
  # the job as a warning — it makes the whole WORKFLOW RUN conclude
  # "success" while the job shows a red X, so run 35764752126 reported
  # green with the iOS build failing outright. A release gated on "main's
  # CI is green" would have sailed straight past it, which is worse than
  # the problem it was there to avoid. Removed now that the job passes;
  # do not put it back — if iOS needs to stop gating, drop the job from
  # the required set instead, where it is visible.
  ios:
    name: iOS (archive + TestFlight)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Apple refuses an upload built against an SDK older than iOS 26:
      #
      #   Validation failed. SDK version issue. This app was built with
      #   the iOS 18.5 SDK. All iOS and iPadOS apps must be built with
      #   the iOS 26 SDK or later, included in Xcode 26 or later, in
      #   order to be uploaded to App Store Connect.
      #
      # The runner image ships several Xcodes and DEFAULTS TO 16.4,
      # whose SDK is iOS 18.5 — so doing nothing here produced an
      # archive that built, signed and exported perfectly and was then
      # rejected at the last step, which is the most expensive place to
      # find out.
      #
      # Chooses the newest Xcode 26.x present rather than pinning an
      # exact version: the image rotates these (26.0.1, 26.1.1, 26.2,
      # 26.3 at the time of writing) and a hard pin would break on the
      # next rotation, in this same expensive way. Sorted with `sort -V`
      # so 26.10 would beat 26.9.
      #
      # Fails loudly if no Xcode 26 exists rather than silently falling
      # back to the default — a silent fallback is exactly how the
      # rejection above reached Apple.
      - name: Select Xcode 26 (iOS 26 SDK — required for upload)
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "${XC:-}" ]; then
            echo "::error::No Xcode 26 on this runner. Apple requires the" \
                 "iOS 26 SDK or later for App Store Connect uploads, and" \
                 "the image default is too old. Available:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XC"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version
          # Assert the SDK actually is >= 26, rather than trusting the
          # app bundle's name to describe what is inside it.
          SDK=$("$XC/Contents/Developer/usr/bin/xcodebuild" -showsdks \
                | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' \
                | sort -V | tail -1)
          echo "Newest iphoneos SDK in this Xcode: ${SDK:-none}"
          case "${SDK:-0}" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::error::Xcode at $XC provides iphoneos SDK" \
                    "'${SDK:-none}', which is below the iOS 26 Apple" \
                    "requires for uploads."
               exit 1 ;;
          esac

      # Same grammar as the build job's "Derive version", plus one extra
      # output. CFBundleVersion must STRICTLY INCREASE across uploads
      # for a given CFBundleShortVersionString, and a number is burned
      # permanently even by an upload that is later rejected — so M.N.P
      # cannot serve as the build number (re-cutting v0.0.52 after a
      # rejected upload would collide). github.run_number is monotonic
      # per repository and never reused.
      - name: Derive version
        id: version
        shell: bash
        run: |
          # A manual run may name the version explicitly. That is the
          # only way to produce an uploadable artefact from a branch:
          # a derived "<tag>-dev.<sha>" version maps to the SAME Android
          # versionCode as the eventual release (cmake/Version.cmake
          # says so and warns), so uploading one burns that release's
          # number permanently. Requiring the operator to type it makes
          # the hazard a decision rather than an accident.
          MANUAL="${{ inputs.version }}"
          if [ -n "$MANUAL" ]; then
            if ! [[ "$MANUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::version input '$MANUAL' is not MAJOR.MINOR.PATCH[-suffix]"
              exit 1
            fi
            VER="$MANUAL"
            echo "Version from workflow_dispatch input: $VER"
          else
            REF="${GITHUB_REF_NAME:-}"
            if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              VER="${REF#v}"
            else
              LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
              LAST="${LAST#v}"
              VER="${LAST}-dev.$(git rev-parse --short HEAD)"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "BSFChat iOS: $VER (CFBundleVersion=${GITHUB_RUN_NUMBER})"

      # Qt for iOS cannot build alone: everything that runs at BUILD
      # time (moc, rcc, qmlimportscanner, qmlcachegen) is host code, and
      # the iOS package ships target libraries only. So the macOS
      # desktop package goes in first and is handed over as QT_HOST_PATH.
      # set-env: false keeps it out of QT_ROOT_DIR so the iOS install
      # below wins that variable.
      - name: Install Qt (host, macOS)
        uses: jurplel/install-qt-action@v4
        with:
          # Lockstep with the build job's pin — see the long note there
          # for why 6.10.3 and not 6.8 LTS or 6.11. scripts/build-ios.sh
          # is pinned to the same version for the same reason.
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia'
          cache: true
          set-env: false
          dir: ${{ runner.temp }}/qt-host

      - name: Install Qt (target, iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: ios
          modules: 'qtmultimedia'
          cache: true
          dir: ${{ runner.temp }}/qt-ios

      - name: Install build dependencies
        run: |
          # Same CMake pin as the macOS job — libdatachannel's vendored
          # deps still trip CMake 4's cmake_minimum_required floor, and
          # the pin costs nothing here.
          pip3 install --break-system-packages cmake==3.30.5

      # OpenSSL for iOS is NOT optional, whatever BSFCHAT_ENABLE_VOICE
      # says. bsfchat_protocol's cmake/Dependencies.cmake opens with an
      # unconditional find_package(OpenSSL REQUIRED) — jwt-cpp needs it —
      # and the client always pulls the protocol library in. So the
      # configure died at "Could NOT find OpenSSL" long before any
      # voice-gated code was reached. (scripts/build-ios.sh had the same
      # wrong assumption and has been corrected to match.)
      #
      # Cached on the script's own contents: it pins the OpenSSL version,
      # so a bump changes the hash and a rebuild happens automatically,
      # while an unchanged script costs ~10s instead of ~10 minutes of
      # cross-compiling on every run.
      # restore + save rather than actions/cache, because that action's
      # implicit save runs as a POST step and is skipped when the job
      # fails — so a run that spent ten minutes cross-compiling OpenSSL
      # and then failed at the compile step threw it away and paid for
      # it again next time. Saving inline, right after a successful
      # build, keeps it whatever the rest of the job does.
      - name: Restore vendored OpenSSL for iOS
        id: openssl_cache
        uses: actions/cache/restore@v4
        with:
          path: deps/openssl-ios-device
          key: openssl-ios-device-${{ hashFiles('scripts/build-openssl-ios.sh') }}

      - name: Build vendored OpenSSL for iOS
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl-ios.sh device

      - name: Save vendored OpenSSL for iOS
        if: steps.openssl_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/openssl-ios-device
          key: openssl-ios-device-${{ hashFiles('scripts/build-openssl-ios.sh') }}

      # === iOS: Import the Apple Distribution certificate ===
      #
      # Same hand-rolled temporary-keychain pattern as the macOS step
      # above, with two differences. The identity must be "Apple
      # Distribution" — a Developer ID certificate signs software
      # distributed OUTSIDE the store and cannot sign an App Store
      # build, so reusing MACOS_CERTIFICATE here will not work. And the
      # whole thing soft-fails: without the secrets the job still
      # compiles the iOS binary, which is the part that regresses, and
      # skips archive/export/upload.
      - name: Import iOS signing certificate
        id: signing
        env:
          IOS_DIST_CERTIFICATE: ${{ secrets.IOS_DIST_CERTIFICATE }}
          IOS_DIST_CERTIFICATE_PWD: ${{ secrets.IOS_DIST_CERTIFICATE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$IOS_DIST_CERTIFICATE" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::IOS_DIST_CERTIFICATE / APPLE_TEAM_ID not set —" \
                 "compiling unsigned, skipping archive and TestFlight upload."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A .p12 exported from Keychain Access effectively always has
          # a passphrase. If the certificate secret is set but the
          # password one is not, `security import` fails several lines
          # below with "MAC verification failed during PKCS12 import",
          # which reads like a corrupt certificate and sends you looking
          # in the wrong place. Say which secret is missing instead.
          if [ -z "${IOS_DIST_CERTIFICATE_PWD:-}" ]; then
            echo "::error::IOS_DIST_CERTIFICATE is set but" \
                 "IOS_DIST_CERTIFICATE_PWD is empty. If the .p12 really has" \
                 "no passphrase, re-export it with one — an unprotected" \
                 "distribution key does not belong in a secret."
            exit 1
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/ios-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          echo "$IOS_DIST_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/ios_dist.p12
          security import $RUNNER_TEMP/ios_dist.p12 -P "$IOS_DIST_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          # codesign: as well as apple-tool:/apple:. Apple's own sample
          # omits it, and with it omitted `codesign` is not on the key's
          # ACL — so instead of failing, it blocks on a GUI keychain
          # prompt that a headless runner can never answer, and the job
          # hangs until the six-hour timeout. Cheap to include, and the
          # failure it prevents is the most expensive kind.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PWD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          rm -f $RUNNER_TEMP/ios_dist.p12
          LINE=$(security find-identity -v -p codesigning $KEYCHAIN_PATH \
            | grep "Apple Distribution" | head -1)
          IDENTITY=$(echo "$LINE" | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Apple Distribution' identity in IOS_DIST_CERTIFICATE." \
                 "A Developer ID or Apple Development certificate cannot sign an App Store build."
            exit 1
          fi
          # The SHA-1 fingerprint, not the display name, is what every
          # later step keys off. Two certificates can share a display
          # name — that is exactly what happens when a second one is
          # issued to the same person — so a name match proves nothing
          # about WHICH certificate signed the archive. The fingerprint
          # does. It is also the value the owner matches against a row
          # in developer.apple.com before revoking anything.
          SHA1=$(echo "$LINE" | awk '{print $2}')
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "IOS_SIGNING_SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"
          echo "Signing identity SHA-1: $SHA1"
          # Serial and expiry too, unredacted: these are the columns the
          # developer-portal certificate list shows, and having them in
          # the log is the difference between "revoke the surplus
          # certificates" being a mechanical task and a guess.
          security find-certificate -c "$IDENTITY" -p $KEYCHAIN_PATH \
            | openssl x509 -noout -serial -enddate -subject || true
          {
            echo "### iOS signing certificate"
            echo ""
            echo "- SHA-1: \`$SHA1\`"
            echo "- This is the ONLY certificate this run is permitted to sign with."
          } >> "$GITHUB_STEP_SUMMARY"

      # === iOS: Materialise the App Store Connect API key ===
      #
      # One key does two jobs. scripts/asc-provisioning.py uses it to
      # DOWNLOAD the App Store provisioning profile that already exists
      # in the account, so there is NO .mobileprovision secret to rotate
      # every twelve months; and the same key authenticates the
      # TestFlight upload at the bottom of this job.
      #
      # It is NOT handed to xcodebuild any more, and that is the point.
      # It used to be, together with -allowProvisioningUpdates, and
      # `man xcodebuild` is explicit about what that combination does:
      # "For automatically signed targets, xcodebuild will create and
      # update profiles, app IDs, and certificates." A CI runner starts
      # with an empty keychain every time, so on every run Xcode decided
      # it had no usable identity and — with an Admin key, which is the
      # only role cloud signing accepts — minted a NEW certificate. Run
      # 36080815332 is where that ran out: "Choose a certificate to
      # revoke. Your account has reached the maximum number of
      # certificates." Nothing below passes -allowProvisioningUpdates to
      # a build or archive action; see the Archive step.
      #
      # It lands in ~/.appstoreconnect/private_keys under the exact
      # AuthKey_<KEYID>.p8 name, which is the convention every Apple
      # upload tool searches for — xcodebuild is passed the path
      # explicitly, but altool (the fallback documented in
      # docs/store-submission-runbook.md, for a hand-driven upload from
      # the owner's Mac) finds it there with no path argument at all.
      #
      # The .p8 can only be downloaded once from App Store Connect, so
      # it lives in the secret base64-encoded.
      - name: Prepare App Store Connect API key
        id: asc
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] \
             || [ -z "$ASC_PRIVATE_KEY_BASE64" ]; then
            echo "::notice::App Store Connect API key secrets not set —" \
                 "archive will need a manually-installed profile, no TestFlight upload."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # === iOS: fetch the provisioning profile, do not create one ===
      #
      # This is the step that replaces automatic signing. It performs
      # GET requests against App Store Connect and nothing else — the
      # script implements no other HTTP verb — so the profile has to
      # already exist, put there once by a human in the portal. If it
      # does not, this fails in ten seconds with instructions, instead
      # of Xcode quietly conjuring one plus a certificate to go with it.
      #
      # It also refuses to continue unless the profile actually lists
      # the certificate we imported above, compared by SHA-1. That check
      # is the difference between "the archive is signed" and "the
      # archive is signed with the key we think it is", and it runs
      # BEFORE the twenty-minute build rather than after it.
      - name: Install the App Store provisioning profile
        id: profile
        if: steps.asc.outputs.available == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Only dependency this script has beyond the standard library
          # (ES256 is not in it). Cheap if the image already carries it.
          python3 -c 'import cryptography' 2>/dev/null \
            || pip3 install --break-system-packages --quiet cryptography
          python3 scripts/asc-provisioning.py fetch-profile \
            --bundle-id com.bsfchat.app \
            --profile-type IOS_APP_STORE \
            --require-sha1 "$IOS_SIGNING_SHA1"

      # -G Xcode, not Ninja: `xcodebuild archive` needs a real Xcode
      # project and the whole codesign/export path is driven through
      # xcodebuild. This mirrors scripts/build-ios.sh, which is the
      # hand-driven version of the same configure.
      #
      # BSFCHAT_ENABLE_VOICE now defaults ON for iOS (CMakeLists.txt):
      # the stack was built, installed and used on a real iPhone on
      # 2026-09-23. This job therefore builds the voice configuration,
      # which is the one that ships — it passes no flag, deliberately,
      # so CI cannot drift from what a developer or a release build
      # produces. OpenSSL was always needed regardless of voice, because
      # bsfchat_protocol requires it unconditionally for jwt-cpp (see the
      # vendoring step above).
      #
      # The OPENSSL_* triple is passed explicitly rather than relying on
      # OPENSSL_ROOT_DIR alone: under the iOS toolchain CMake's
      # find_library is confined to the sysroot, so a root hint pointing
      # at deps/ would be searched and skipped.
      #
      # CMAKE_XCODE_GENERATE_SCHEME=ON because every xcodebuild call
      # below drives the project by `-scheme bsfchat-app`, and CMake's
      # Xcode generator writes no .xcscheme files unless asked.
      - name: Configure (iOS device)
        run: |
          export PATH="$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          OPENSSL_IOS="$GITHUB_WORKSPACE/deps/openssl-ios-device"
          "$QT_ROOT_DIR/bin/qt-cmake" -B build-ios -G Xcode -Wno-dev \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DGAMECHAT_CLIENT_BUILD_TESTS=OFF \
            -DBSFCHAT_VERSION="${{ steps.version.outputs.version }}" \
            -DBSFCHAT_BUNDLE_ID=com.bsfchat.app \
            -DBSFCHAT_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            -DQT_HOST_PATH="${{ runner.temp }}/qt-host/Qt/6.10.3/macos" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DOPENSSL_ROOT_DIR="$OPENSSL_IOS" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_IOS/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_IOS/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_IOS/lib/libssl.a"

      # We deliberately pass no -DCMAKE_OSX_DEPLOYMENT_TARGET: Qt's own
      # toolchain picks it, so the floor we declare always matches what
      # Qt's objects were actually built for. That does mean a Qt
      # upgrade can move the minimum iOS version under us — and raising
      # it drops devices — so print it here, where a diff in the log
      # makes the change visible instead of silent.
      - name: Report iOS deployment target
        run: |
          TARGET=$(grep -m1 '^CMAKE_OSX_DEPLOYMENT_TARGET:' build-ios/CMakeCache.txt | cut -d= -f2)
          echo "Minimum iOS version (chosen by the Qt toolchain): ${TARGET:-<unset>}"
          echo "iOS deployment target: ${TARGET:-<unset>}" >> "$GITHUB_STEP_SUMMARY"

      # Compile-only gate. Runs on fork PRs where no secrets exist, so
      # it must not need an identity — CODE_SIGNING_ALLOWED=NO turns the
      # signing phase off entirely. This is the step that catches
      # "someone added a macOS-only source file to the shared target
      # again", which is the failure this whole job exists to prevent.
      - name: Build (unsigned compile check)
        if: steps.profile.outputs.available != 'true'
        run: |
          xcodebuild build -quiet \
            -project build-ios/bsfchat-client.xcodeproj \
            -scheme bsfchat-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Manual signing, no -allowProvisioningUpdates, no authentication
      # key: this invocation cannot reach the Apple Developer website at
      # all, so it cannot create a certificate however confused it gets.
      #
      # Why the old CODE_SIGN_STYLE=Automatic form burned a certificate
      # per run, in one paragraph, because the symptom did not look like
      # the cause. Nothing in the project or the command line ever set
      # CODE_SIGN_IDENTITY, so the iphoneos default applied: "Apple
      # Development". Automatic signing therefore went looking for a
      # DEVELOPMENT identity and a development profile — which is why
      # the eventual failure read "Xcode couldn't find any iOS App
      # Development provisioning profiles matching 'com.bsfchat.app'"
      # even though the job had just imported an Apple DISTRIBUTION
      # certificate and logged it. The distribution certificate was
      # never the one being looked for. It was used later, at export,
      # where the app-store method re-signs — which is exactly why the
      # job passed for weeks while quietly minting a development
      # certificate on every single run. A fresh runner keychain means
      # the previous run's certificate and its private key are gone, so
      # nothing was ever reused.
      #
      # Pinned by SHA-1, not by name: see the import step.
      #
      # And pinned WITHOUT the `[sdk=iphoneos*]` conditional, which used
      # to be passed alongside the plain setting as a belt-and-braces
      # second copy. It is xcconfig syntax and is not valid on the
      # xcodebuild command line: xcodebuild splits an argument on the
      # FIRST `=`, and in
      #
      #     CODE_SIGN_IDENTITY[sdk=iphoneos*]=EC2BD57E...
      #
      # that `=` is the one INSIDE the brackets. So the name parsed as
      # `CODE_SIGN_IDENTITY[sdk`, the value as `iphoneos*]=EC2BD57E...`,
      # and the name was then normalised back to CODE_SIGN_IDENTITY —
      # overriding the correct assignment on the line above it with a
      # value that is not a SHA-1 at all:
      #
      #     error: No certificate for team '...' matching
      #     'iphoneos*]=EC2BD57E9314F626D4100B7782B6CB52E1B12868' found
      #
      # which reads like a keychain or team problem and is neither. The
      # plain form is sufficient: a command-line build setting applies
      # to every SDK, and -destination already pins this to iOS.
      - name: Archive
        if: steps.profile.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Snapshot every code-signing identity visible right now. The
          # guard step below diffs against this; anything new means
          # something installed a certificate mid-build, which is the
          # failure this whole change exists to prevent.
          security find-identity -v -p codesigning \
            | awk '/\)/ {print $2}' | sort -u > "$RUNNER_TEMP/identities-before.txt"
          cat "$RUNNER_TEMP/identities-before.txt"
          xcodebuild archive -quiet \
            -project build-ios/bsfchat-client.xcodeproj \
            -scheme bsfchat-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BSFChat.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_SHA1" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.uuid }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"

      # === The loud part ===
      #
      # An archive signed by the wrong certificate is not a cosmetic
      # problem, it is the bug above happening again, and last time it
      # was invisible for several runs because everything downstream
      # still succeeded. So assert it, on the artefact, not on the
      # intent:
      #
      #   1. the leaf certificate embedded in the signature has the
      #      exact SHA-1 of the .p12 we imported;
      #   2. the profile baked into the .app is the one we downloaded;
      #   3. no code-signing identity appeared on this machine that was
      #      not there before the archive ran.
      #
      # (3) is the direct tripwire: a certificate created by Xcode lands
      # in a keychain on the runner, so a new fingerprint here means one
      # was minted. It is cheap and it does not depend on parsing
      # xcodebuild's output, which is -quiet and changes between Xcodes.
      - name: Verify the archive used the imported certificate
        if: steps.profile.outputs.available == 'true'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BSFChat.xcarchive/Products/Applications/bsfchat-app.app"
          WORK="$RUNNER_TEMP/signing-check"
          mkdir -p "$WORK"

          # 1. Who actually signed it.
          ( cd "$WORK" && codesign -d --extract-certificates=leaf "$APP" 2>/dev/null )
          ACTUAL=$(openssl x509 -inform DER -in "$WORK/leaf0" -noout -fingerprint -sha1 \
            | sed 's/.*=//; s/://g' | tr 'a-f' 'A-F')
          echo "Archive signed by : $ACTUAL"
          echo "Imported .p12     : $IOS_SIGNING_SHA1"
          if [ "$ACTUAL" != "$IOS_SIGNING_SHA1" ]; then
            echo "::error::The archive was signed by certificate $ACTUAL, which is" \
                 "NOT the one imported from IOS_DIST_CERTIFICATE ($IOS_SIGNING_SHA1)." \
                 "Do not upload this build. A certificate may have been created on" \
                 "the developer account — check" \
                 "https://developer.apple.com/account/resources/certificates/list"
            codesign -dvvv "$APP" 2>&1 | sed -n '1,40p'
            exit 1
          fi

          # 2. Which profile it embedded.
          # Via a real file: PlistBuddy does not read a pipe.
          security cms -D -i "$APP/embedded.mobileprovision" > "$WORK/profile.plist"
          EMBEDDED=$(/usr/libexec/PlistBuddy -c "print UUID" "$WORK/profile.plist")
          echo "Embedded profile  : $EMBEDDED"
          if [ "$EMBEDDED" != "${{ steps.profile.outputs.uuid }}" ]; then
            echo "::error::The archive embeds provisioning profile $EMBEDDED, not the" \
                 "one this job downloaded (${{ steps.profile.outputs.uuid }})." \
                 "Something provisioned this build behind our back."
            exit 1
          fi

          # 3. Nothing new on the machine.
          security find-identity -v -p codesigning \
            | awk '/\)/ {print $2}' | sort -u > "$RUNNER_TEMP/identities-after.txt"
          NEW=$(comm -13 "$RUNNER_TEMP/identities-before.txt" \
                         "$RUNNER_TEMP/identities-after.txt" || true)
          if [ -n "$NEW" ]; then
            echo "::error::A code-signing identity appeared during the archive:" \
                 "$NEW. That means a certificate was created on the developer" \
                 "account. Revoke it at" \
                 "https://developer.apple.com/account/resources/certificates/list"
            security find-identity -v -p codesigning
            exit 1
          fi

          {
            echo "### iOS signing (verified)"
            echo ""
            echo "- Signed by: \`$ACTUAL\` (matches \`IOS_DIST_CERTIFICATE\`)"
            echo "- Profile: \`${{ steps.profile.outputs.name }}\` (\`$EMBEDDED\`)"
            echo "- No certificate was created: identity set unchanged across the archive."
          } >> "$GITHUB_STEP_SUMMARY"

      # Check the artefact, not the source — same reasoning as the
      # macOS bundle's PlistBuddy guard in CMakeLists.txt. These two
      # keys fail LATE and expensively: a missing export-compliance
      # declaration turns every upload into a manual questionnaire, and
      # a bundle id that fell back to the .dev default uploads to an app
      # record that does not exist, after the archive has already cost
      # twenty minutes.
      - name: Verify archived Info.plist
        if: steps.profile.outputs.available == 'true'
        run: |
          APP="$RUNNER_TEMP/BSFChat.xcarchive/Products/Applications/bsfchat-app.app"
          /usr/libexec/PlistBuddy -c "print ITSAppUsesNonExemptEncryption" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "print NSMicrophoneUsageDescription" "$APP/Info.plist" > /dev/null
          /usr/libexec/PlistBuddy -c "print NSLocalNetworkUsageDescription" "$APP/Info.plist" > /dev/null
          ID=$(/usr/libexec/PlistBuddy -c "print CFBundleIdentifier" "$APP/Info.plist")
          test "$ID" = "com.bsfchat.app" \
            || { echo "::error::bundle id is '$ID', expected com.bsfchat.app"; exit 1; }
          # The asset catalog has to have COMPILED, not merely been
          # listed as a source: an iOS bundle with no CFBundleIconName
          # is rejected by the upload validator (ITMS-90713) with no
          # other symptom.
          /usr/libexec/PlistBuddy -c "print CFBundleIconName" "$APP/Info.plist"

      - name: Export .ipa
        if: steps.profile.outputs.available == 'true'
        run: |
          set -euo pipefail
          # ExportOptions is templated rather than committed complete:
          # the team id is one account-specific value, and the
          # destination is the difference between "write me an .ipa" and
          # "send it to Apple". This render is the former; the upload
          # step below renders the same template again as the latter.
          sed -e "s/@APPLE_TEAM_ID@/${{ secrets.APPLE_TEAM_ID }}/" \
              -e "s/@EXPORT_DESTINATION@/export/" \
              -e "s/@SIGNING_CERTIFICATE@/${{ steps.signing.outputs.sha1 }}/" \
              -e "s/@PROVISIONING_PROFILE@/${{ steps.profile.outputs.uuid }}/" \
            ios/ExportOptions.plist.in > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          # A `sed` that did not substitute leaves the placeholder
          # LITERALLY in the file — a valid plist with teamID
          # "@APPLE_TEAM_ID@", which is what an unset/renamed
          # APPLE_TEAM_ID secret produces. plutil -lint is happy with it
          # and xcodebuild then fails much later with a signing error
          # that says nothing about the secret. Catch it here.
          # Checked against the PARSED plist, not the file text. The
          # template's leading comment says "The @PLACEHOLDERS@ are the
          # account- and run-specific values", and a grep over the raw
          # file matches that prose — failing the job over its own
          # documentation. plutil -p prints values only, with comments
          # gone, so this asks the question it means to ask.
          if plutil -p "$RUNNER_TEMP/ExportOptions.plist" \
               | grep -q '@[A-Z_][A-Z_]*@'; then
            echo "::error::ExportOptions.plist still contains unsubstituted" \
                 "@PLACEHOLDER@ values — check the APPLE_TEAM_ID secret," \
                 "the signing identity and the provisioning profile steps."
            plutil -p "$RUNNER_TEMP/ExportOptions.plist"
            exit 1
          fi
          # Printed because it is the first thing anyone debugging an
          # export failure asks to see, and it carries no secret that is
          # not already masked: teamID comes from a secret, so the
          # runner redacts it, and method/signingStyle/destination are
          # exactly the values in the committed template.
          echo "Rendered ExportOptions.plist:"
          plutil -p "$RUNNER_TEMP/ExportOptions.plist"
          # No -allowProvisioningUpdates and no -authenticationKey* here.
          # The export re-signs, so it is a second place a certificate
          # could have been created; with signingStyle manual and the
          # profile already on disk it needs nothing from Apple, so it
          # is given nothing. (An earlier version of this step passed
          # the ASC key whenever one was available — that is what minted
          # an Apple Development certificate on every run.)
          #
          # exportArchive prints a two-line summary on failure and puts
          # the ACTUAL reason in an .xcdistributionlogs bundle in
          # $TMPDIR, which dies with the runner. That is how a "Cloud
          # signing permission error / No profiles for 'com.bsfchat.app'
          # were found" pair reached us with no way to tell an
          # API-key-permission problem from a missing App ID from an
          # unaccepted licence agreement — three different fixes, none
          # of them in this repo. Dump the bundle before exiting so the
          # next failure is diagnosable from the log alone.
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BSFChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          EXPORT_RC=$?
          set -e
          if [ "$EXPORT_RC" -ne 0 ]; then
            echo "::group::exportArchive distribution logs"
            LOGS=$(ls -dt "${TMPDIR:-/tmp}"/*.xcdistributionlogs 2>/dev/null | head -1)
            if [ -n "${LOGS:-}" ] && [ -d "$LOGS" ]; then
              echo "Log bundle: $LOGS"
              find "$LOGS" -type f
              find "$LOGS" -type f -name '*.log' | while read -r f; do
                echo "----- $f -----"
                tail -n 300 "$f"
              done
            else
              echo "No .xcdistributionlogs bundle under ${TMPDIR:-/tmp}"
            fi
            echo "::endgroup::"
            exit "$EXPORT_RC"
          fi
          # Resolved-and-UNIQUE, not `head -1`. The .ipa is named after
          # the product rather than the scheme so it has to be resolved,
          # but taking the first of several would be worse than failing:
          # an export that emits more than one .ipa means something
          # changed about how it is packaged, and uploading whichever
          # one the filesystem returned first is exactly the kind of
          # mistake that is only visible in App Store Connect. (This is
          # also why the `thinning` key is no longer in ExportOptions —
          # it was what could produce a directory of per-variant .ipa
          # files here.) exportArchive can exit 0 having written only
          # logs, so zero is a failure too.
          # No `mapfile` here, unlike the Android job: this runs on macOS,
          # where /bin/bash is still 3.2 and mapfile does not exist.
          IPA_COUNT=$(find "$RUNNER_TEMP/export" -name '*.ipa' | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" -ne 1 ]; then
            echo "::error::expected exactly 1 .ipa from exportArchive, found $IPA_COUNT"
            ls -laR "$RUNNER_TEMP/export"
            exit 1
          fi
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa')
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload .ipa artifact
        if: steps.profile.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BSFChat-iOS
          path: ${{ runner.temp }}/export/*.ipa

      # Tags only, or a manual run that explicitly asked. A TestFlight
      # build number is consumed permanently on upload, so uploading
      # from every main push would burn the numbers and fill the
      # tester-facing build list with noise.
      #
      # `xcodebuild -exportArchive` with destination=upload, NOT
      # iTMSTransporter and not altool. The previous version of this
      # step ran:
      #
      #     xcrun iTMSTransporter -m upload -assetFile "$IPA_PATH" ...
      #
      # which on current Xcode prints "iTMSTransporter is now part of
      # Transporter. Please install Transporter from the Mac App Store"
      # and exits — the binary Xcode ships under that name is a stub.
      # Verified against Xcode 26.6 locally; the macos-15 runner image
      # moves with Xcode, so this would have failed the first time it
      # ran for real, at the last step of a tag build, after the archive
      # had already cost twenty minutes.
      #
      # altool --upload-package does still work, but its option spelling
      # changed between Xcode 16 (--apiKey/--apiIssuer) and Xcode 26
      # (--api-key/--api-issuer), so pinning either one makes the job
      # depend on the runner image's Xcode. xcodebuild's own upload
      # destination has been stable across both, is documented in
      # `xcodebuild -help`, and reuses the exact -authenticationKey*
      # arguments the archive and export steps already pass. One tool,
      # no third-party action, nothing to re-learn when Xcode moves.
      #
      # It re-exports from the same archive rather than uploading the
      # .ipa produced above. That costs a minute or two and buys the
      # guarantee that what Apple receives came out of the same archive
      # the artefact did, signed the same way, with no opportunity for
      # the two to diverge.
      - name: Upload to TestFlight
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.ios_upload)
          && steps.profile.outputs.available == 'true'
          && steps.asc.outputs.available == 'true'
        run: |
          set -euo pipefail
          sed -e "s/@APPLE_TEAM_ID@/${{ secrets.APPLE_TEAM_ID }}/" \
              -e "s/@EXPORT_DESTINATION@/upload/" \
              -e "s/@SIGNING_CERTIFICATE@/${{ steps.signing.outputs.sha1 }}/" \
              -e "s/@PROVISIONING_PROFILE@/${{ steps.profile.outputs.uuid }}/" \
            ios/ExportOptions.plist.in > "$RUNNER_TEMP/ExportOptions-upload.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions-upload.plist"
          # Parsed, not raw — see the comment in the "Export .ipa" step.
          if plutil -p "$RUNNER_TEMP/ExportOptions-upload.plist" \
               | grep -q '@[A-Z_][A-Z_]*@'; then
            echo "::error::ExportOptions-upload.plist still contains" \
                 "unsubstituted @PLACEHOLDER@ values."
            plutil -p "$RUNNER_TEMP/ExportOptions-upload.plist"
            exit 1
          fi
          echo "Rendered ExportOptions-upload.plist:"
          plutil -p "$RUNNER_TEMP/ExportOptions-upload.plist"
          # The -authenticationKey* trio stays: destination=upload has to
          # authenticate to App Store Connect to hand over the build.
          # -allowProvisioningUpdates does NOT stay — that flag is about
          # provisioning, not upload, and it is the one that could mint a
          # certificate.
          #
          # Same .xcdistributionlogs dump as the "Export .ipa" step —
          # see the comment there. This is the step that actually hands
          # the build to Apple, so an undiagnosable failure here is the
          # most expensive one in the job.
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BSFChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          UPLOAD_RC=$?
          set -e
          if [ "$UPLOAD_RC" -ne 0 ]; then
            echo "::group::exportArchive distribution logs"
            LOGS=$(ls -dt "${TMPDIR:-/tmp}"/*.xcdistributionlogs 2>/dev/null | head -1)
            if [ -n "${LOGS:-}" ] && [ -d "$LOGS" ]; then
              echo "Log bundle: $LOGS"
              find "$LOGS" -type f
              find "$LOGS" -type f -name '*.log' | while read -r f; do
                echo "----- $f -----"
                tail -n 300 "$f"
              done
            else
              echo "No .xcdistributionlogs bundle under ${TMPDIR:-/tmp}"
            fi
            echo "::endgroup::"
            exit "$UPLOAD_RC"
          fi
          {
            echo "### TestFlight"
            echo ""
            echo "Uploaded \`${{ steps.version.outputs.version }}\`" \
                 "build \`${{ steps.version.outputs.build_number }}\`."
            echo ""
            echo "Processing in App Store Connect takes 5-30 minutes." \
                 "Export compliance must be answered before external" \
                 "testers can be added — see docs/store-submission-runbook.md."
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately duplicates check (3) of the verify step, and runs
      # however the job ended. The verify step's copy exists to stop a
      # suspect build BEFORE it is exported and uploaded; this one
      # exists because the run that exposed the whole problem
      # (36080815332) FAILED during the archive — and a run that dies
      # part-way through provisioning is exactly the kind that can leave
      # a certificate behind on the account with nothing downstream to
      # notice. A tripwire that only fires on success is not a tripwire.
      - name: Tripwire — did anything create a signing identity?
        if: always() && steps.profile.outputs.available == 'true'
        run: |
          BEFORE="$RUNNER_TEMP/identities-before.txt"
          if [ ! -f "$BEFORE" ]; then
            echo "Archive never started; nothing to compare."
            exit 0
          fi
          security find-identity -v -p codesigning \
            | awk '/\)/ {print $2}' | sort -u > "$RUNNER_TEMP/identities-final.txt"
          NEW=$(comm -13 "$BEFORE" "$RUNNER_TEMP/identities-final.txt" || true)
          if [ -n "$NEW" ]; then
            echo "::error::A code-signing identity was created during this run:" \
                 "$NEW. CI is not supposed to be able to do that. Revoke it at" \
                 "https://developer.apple.com/account/resources/certificates/list" \
                 "and see docs/ios-release.md section 1.4."
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "No signing identity was created during this run."

      # Runs even when an earlier step failed: the decoded .p8 is a
      # long-lived App Store Connect credential and must not survive on
      # a runner, however the job ended.
      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

  # Create GitHub Release on tag push
  #
  # Deliberately still `needs: build` only, NOT `[build, android]`. The
  # Android job is new and unproven; making it a release gate would let a
  # first-run Android packaging hiccup block a desktop release, and the
  # .aab's real destination is the Play Console rather than a GitHub
  # Release anyway. Once the Android job has a few green runs behind it,
  # add it to `needs` and add
  #   artifacts/BSFChat-Android-APK/BSFChat-android-arm64.apk
  # to the files list below so sideloaders get it straight off the
  # release page.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Which channel this tag publishes to. The in-app updater filters
      # releases on GitHub's `prerelease` boolean — never on the text of
      # the tag — so this step is what makes that flag trustworthy:
      #
      #   v0.0.44        → prerelease: false → everyone sees it
      #   v0.0.44-rc.1   → prerelease: true  → only beta-channel users
      #
      # A prerelease is also excluded from /releases/latest by GitHub,
      # which is what keeps any other consumer of that endpoint (install
      # docs, scripts) on stable builds without further changes.
      #
      # Same tag grammar as the "Derive version" step above. A tag that
      # does not match fails here rather than publishing artefacts whose
      # embedded version was silently synthesised as a -dev build.
      - name: Classify release channel
        id: channel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG → RC / prerelease (beta channel only)"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG → stable release"
          else
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix];" \
                 "the build embedded a -dev version for it. Retag."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BSFChat-macOS/BSFChat-macOS.dmg
            artifacts/BSFChat-Windows/BSFChat-Setup.exe
            artifacts/BSFChat-Linux/BSFChat-linux-x86_64.tar.gz
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease }}
